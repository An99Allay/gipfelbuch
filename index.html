<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gipfelbuch</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
</head>
<body>
<div id="map" aria-label="Karte"></div>
<div class="loadbar" id="loadbar"></div>

<!-- Ladeschleier mit Höhenlinien -->
<div class="veil" id="veil">
  <svg class="contours" viewBox="-200 -200 400 400" aria-hidden="true" id="contours"></svg>
  <div class="veil-text">
    <div class="veil-brand">Gipfelbuch</div>
    <div class="veil-sub" id="veilSub">Gelände wird geladen …</div>
  </div>
</div>

<!-- Kopf -->
<header class="top">
  <button class="brand" id="homeBtn" title="Zurück nach Kriens">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M2 20 9 7l4 6 3-4 6 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </span>
    <span class="brand-text"><b>Gipfelbuch</b><small>ab Kriens · 47.03° N 8.28° E</small></span>
  </button>
  <div class="progress" id="progress" title="Bestiegene Gipfel">
    <div class="progress-num"><b id="doneCount">0</b><span>/<i id="totalCount">0</i></span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">Gipfel bestiegen</div>
  </div>
</header>

<!-- Steuerung rechts -->
<div class="tools">
  <button class="tool primary" id="routeBtn"><svg viewBox="0 0 24 24"><path d="M5 19c3-6 6 2 9-4s4-6 5-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="5" cy="19" r="2.2" fill="currentColor"/><circle cx="19" cy="5" r="2.2" fill="currentColor"/></svg><span>Meine Route</span></button>
  <button class="tool" id="skyBtn" title="Alle Gipfel als Silhouette"><svg viewBox="0 0 24 24"><path d="M2 20 7 10l3 5 4-9 3 6 2-3 3 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Skyline</span></button>
  <button class="tool" id="worldBtn" title="Ganze Welt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>Welt</span></button>
  <button class="tool" id="tiltBtn" title="2D / 3D umschalten"><svg viewBox="0 0 24 24"><path d="M3 17 12 21l9-4-9-4z M3 12l9 4 9-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9l4-6 4 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="tiltLabel">3D</span></button>
</div>

<!-- Liste -->
<aside class="list" id="list" aria-label="Bergliste">
  <div class="list-grip" id="listGrip" aria-hidden="true"></div>
  <div class="list-head">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Berg suchen" autocomplete="off">
    </div>
    <div class="chips" role="tablist">
      <button class="chip on" data-f="all" id="fAll">Alle</button>
      <button class="chip" data-f="open" id="fOpen">Offen</button>
      <button class="chip" data-f="done" id="fDone">Bestiegen</button>
    </div>
  </div>
  <div class="list-body" id="listBody"></div>
</aside>

<!-- Steckbrief -->
<section class="detail" id="detail" aria-label="Steckbrief" hidden>
  <div class="detail-grip" aria-hidden="true"></div>
  <button class="close" id="closeDetail" aria-label="Steckbrief schliessen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <div class="detail-scroll" id="detailScroll"></div>
</section>

<!-- Skyline: alle Gipfel von nah nach fern -->
<section class="skyline" id="skyline" hidden aria-label="Skyline aller Gipfel">
  <div class="sky-head">
    <div><b>Skyline</b><small>Von Kriens hinaus in die Welt · Höhe massstäblich</small></div>
    <button class="close" id="skyClose" aria-label="Skyline schliessen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="sky-scroll"><svg id="skySvg" role="img" aria-label="Gipfel-Silhouette"></svg></div>
  <div class="sky-tip" id="skyTip" hidden></div>
</section>

<!-- Ankunftskarte für die Routenfahrt -->
<div class="arrival" id="arrival" hidden></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="">
  <div class="lb-bar">
    <div class="lb-meta" id="lbMeta"></div>
    <div class="lb-nav">
      <button id="lbPrev" aria-label="Vorheriges Foto"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <span id="lbCount"></span>
      <button id="lbNext" aria-label="Nächstes Foto"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button id="lbClose" aria-label="Schliessen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
  /* immer die neueste Bergliste laden, nicht die aus dem Browser-Cache */
  ["data.js", "routes.js", "app.js"].forEach((s) => document.write('<script src="' + s + "?t=" + Date.now() + '"><\/script>'));
</script>
</body>
</html>
